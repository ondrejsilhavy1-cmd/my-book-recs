//  OPEN LIBRARY COVER FETCHER — automatic, no API key needed

const coverCache = {};

async function fetchCover(title, author) {
    const key = `${title}||${author}`;
    if (key in coverCache) return coverCache[key];
    const q = encodeURIComponent(`${title} ${author}`);
    try {
        const res = await fetch(`https://openlibrary.org/search.json?q=${q}&fields=cover_i&limit=5`);
        const { docs = [] } = await res.json();
        for (const doc of docs) {
            if (doc.cover_i) {
                const url = `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
                coverCache[key] = url; return url;
            }
        }
    } catch(_) {}
    coverCache[key] = null; return null;
}

function skeleton() { const d = document.createElement('div'); d.className = 'cover-skeleton'; return d; }
function placeholder(title) { const d = document.createElement('div'); d.className = 'cover-placeholder'; d.textContent = title; return d; }

async function loadCover(el, title, author) {
    el.innerHTML = ''; el.appendChild(skeleton());
    const url = await fetchCover(title, author);
    el.innerHTML = '';
    if (url) {
        const img = new Image();
        img.alt = title; img.loading = 'lazy';
        img.onerror = () => { el.innerHTML = ''; el.appendChild(placeholder(title)); };
        img.onload = () => { el.innerHTML = ''; el.appendChild(img); };
        img.src = url;
    } else { el.appendChild(placeholder(title)); }
}

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════

function renderFeatured(b, container) {
    const a = document.createElement('a');
    a.href = b.amazon; a.target = '_blank'; a.className = 'card-featured';
    const coverEl = document.createElement('div'); coverEl.className = 'cover';
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = `<span class="reading-badge">Reading now</span><strong>${b.title}</strong><em>${b.author}</em><div class="desc">${b.desc || ''}<br><span class="why-label">Why read it:</span> ${b.why || ''}</div>`;
    a.append(coverEl, info); container.appendChild(a);
    loadCover(coverEl, b.title, b.author);
}

function renderCard(b, container) {
    const a = document.createElement('a');
    a.href = b.amazon; a.target = '_blank'; a.className = 'card';
    const wrap = document.createElement('div'); wrap.className = 'cover-wrap';
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = `<strong>${b.title}</strong><em>${b.author}</em>${b.desc ? `<div class="desc">${b.desc}${b.why ? `<br><span class="why-label">Why read it:</span> ${b.why}` : ''}</div>` : ''}`;
    a.append(wrap, info); container.appendChild(a);
    loadCover(wrap, b.title, b.author);
}

function renderMini(b, container) {
    const a = document.createElement('a');
    a.href = b.amazon; a.target = '_blank'; a.className = 'card-mini';
    const wrap = document.createElement('div'); wrap.className = 'cover-wrap';
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = `<strong>${b.title}</strong><em>${b.author}</em>`;
    a.append(wrap, info); container.appendChild(a);
    loadCover(wrap, b.title, b.author);
}

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════

(function init() {
    const rg = document.getElementById('reading-grid');
    const dg = document.getElementById('recs-grid');
    const pg = document.getElementById('pipeline-grid');
    document.getElementById('reading-count').textContent = `${READING.length} book${READING.length!==1?'s':''}`;
    document.getElementById('recs-count').textContent    = `${RECS.length} books`;
    READING.forEach(b => renderFeatured(b, rg));
    RECS.forEach(b => renderCard(b, dg));
    // deduplicate pipeline
    const seen = new Set();
    PIPELINE.filter(b => { const k=b.title.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true; })
            .forEach(b => renderMini(b, pg));
})();

// ═══════════════════════════════════════════════════════════════════
//  THEME
// ═══════════════════════════════════════════════════════════════════

function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
const saved = localStorage.getItem('theme');
if (saved==='dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark');
}
const scrollBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => { scrollBtn.style.display = window.scrollY > 400 ? 'flex' : 'none'; });
</script>
